<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">A question-led structural health monitoring loop</title><desc id="desc">Define a question, measure a relevant response, check data quality, account for context, review the evidence and take a targeted action. New evidence refines the original question.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#7251b6"/></marker></defs>
<rect width="1000" height="620" rx="18" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#1e293b"><text x="45" y="55" font-size="28" font-weight="700">SIGNALS BECOME EVIDENCE</text><text x="45" y="90" font-size="20" fill="#64748b">Monitoring starts with a question, not a sensor catalogue</text></g>
<g fill="#fff" stroke="#cbd5e1" stroke-width="2"><rect x="55" y="145" width="260" height="130" rx="12" fill="#eee7f9"/><rect x="370" y="145" width="260" height="130" rx="12"/><rect x="685" y="145" width="260" height="130" rx="12"/><rect x="685" y="365" width="260" height="130" rx="12"/><rect x="370" y="365" width="260" height="130" rx="12" fill="#eee7f9"/><rect x="55" y="365" width="260" height="130" rx="12"/></g>
<g font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#334155"><text x="77" y="183">01  Question</text><text x="392" y="183">02  Measurements</text><text x="707" y="183">03  Quality checks</text><text x="707" y="403">04  Context</text><text x="392" y="403">05  Engineer review</text><text x="77" y="403">06  Targeted action</text></g>
<g font-family="Arial,sans-serif" font-size="20" fill="#64748b"><text x="77" y="222">Response of interest</text><text x="77" y="253">Decision to support</text><text x="392" y="222">Relevant sensors</text><text x="392" y="253">Location + units + time</text><text x="707" y="222">Missing or faulty data?</text><text x="707" y="253">Calibration + timing</text><text x="707" y="442">Environment + traffic</text><text x="707" y="473">Baseline + uncertainty</text><text x="392" y="442">Competing explanations</text><text x="392" y="473">Evidence + inspection</text><text x="77" y="442">Investigate or intervene</text><text x="77" y="473">Document the outcome</text></g>
<g fill="none" stroke="#7251b6" stroke-width="3" marker-end="url(#arrow)"><path d="M315 210H356"/><path d="M630 210H671"/><path d="M815 275V351"/><path d="M685 430H644"/><path d="M370 430H329"/><path d="M185 365V289"/></g>
<text x="208" y="326" font-family="Arial,sans-serif" font-size="18" fill="#7251b6">Refine</text>
<text x="45" y="559" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#334155">An alert is a request for review, not an automatic diagnosis.</text>
<text x="45" y="593" font-family="Arial,sans-serif" font-size="18" fill="#64748b">No real sensor data, thresholds, or claims of measured performance are shown.</text>
</svg>
