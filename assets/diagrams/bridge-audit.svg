<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">From audit evidence to action</title><desc id="desc">Documents and field observations support assessment, action and verification. Potentially critical findings branch directly to escalation.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#7251b6"/></marker><marker id="urgent" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#aa4a28"/></marker></defs>
<rect width="1000" height="620" rx="18" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#1e293b"><text x="45" y="55" font-size="28" font-weight="700">EVIDENCE → DECISION → FOLLOW-UP</text><text x="45" y="90" font-size="20" fill="#64748b">Illustrative structural safety audit workflow</text></g>
<g fill="#fff" stroke="#cbd5e1" stroke-width="2"><rect x="45" y="130" width="270" height="112" rx="12"/><rect x="45" y="280" width="270" height="112" rx="12"/><rect x="405" y="215" width="240" height="132" rx="12" fill="#eee7f9"/><rect x="725" y="215" width="230" height="132" rx="12"/><rect x="725" y="425" width="230" height="112" rx="12"/><rect x="45" y="460" width="490" height="100" rx="12" fill="#fff1e9" stroke="#d7a085"/></g>
<g font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#334155"><text x="67" y="171">Documents</text><text x="67" y="321">Observations</text><text x="429" y="258">Assessment</text><text x="746" y="258">Action plan</text><text x="748" y="470">Verification</text><text x="70" y="500" fill="#943d21">Urgent escalation</text></g>
<g font-family="Arial,sans-serif" font-size="20" fill="#64748b"><text x="67" y="207">History + assumptions</text><text x="67" y="357">Condition + limitations</text><text x="429" y="295">Analyse the evidence</text><text x="429" y="325">Identify uncertainty</text><text x="747" y="295">Priority + ownership</text><text x="747" y="325">Clear next step</text><text x="747" y="507">Confirm + document</text><text x="70" y="535" fill="#943d21">Potentially critical finding → owner procedure</text></g>
<g fill="none" stroke="#7251b6" stroke-width="3" marker-end="url(#arrow)"><path d="M315 185H360V255H391"/><path d="M315 335H360V310H391"/><path d="M645 281H711"/><path d="M840 347V411"/><path d="M725 490H610V365"/></g>
<path d="M180 392V445" fill="none" stroke="#aa4a28" stroke-width="3" marker-end="url(#urgent)"/>
<text x="575" y="395" font-family="Arial,sans-serif" font-size="18" fill="#7251b6">Reassess</text>
<text x="45" y="598" font-family="Arial,sans-serif" font-size="18" fill="#64748b">Do not wait for routine reporting to escalate a potentially critical finding.</text>
</svg>
