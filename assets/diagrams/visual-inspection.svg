<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">A repeatable visual inspection record</title><desc id="desc">An invented bridge plan marks span two, girder two; a linked defect detail and observation log preserve context and limitations.</desc>
<rect width="1000" height="620" rx="18" fill="#f8fafc"/>
<g font-family="Arial,sans-serif" fill="#1e293b"><text x="45" y="55" font-size="28" font-weight="700">LOCATE · OBSERVE · RECORD</text><text x="45" y="90" font-size="20" fill="#64748b">Example only · no actual bridge measurements</text></g>
<g fill="#fff" stroke="#cbd5e1" stroke-width="2"><rect x="45" y="135" width="505" height="270" rx="12"/><rect x="630" y="135" width="325" height="270" rx="12"/><rect x="45" y="435" width="910" height="130" rx="12" fill="#eee7f9"/></g>
<g font-family="Arial,sans-serif" font-size="21" fill="#334155"><text x="68" y="172" font-weight="700">Member-location map</text><text x="655" y="172" font-weight="700">Defect close-up</text><text x="180" y="213">Span 1</text><text x="373" y="213">Span 2</text><text x="70" y="253">G1</text><text x="70" y="303">G2</text><text x="70" y="353">G3</text></g>
<g fill="none" stroke="#64748b" stroke-width="4"><path d="M125 245H510M125 295H510M125 345H510"/><path d="M130 226V367M317 226V367M505 226V367" stroke-width="2" stroke-dasharray="5 6"/></g>
<circle cx="410" cy="295" r="18" fill="#e4d8f4" stroke="#7251b6" stroke-width="3"/>
<path d="M429 295H586V250H630" fill="none" stroke="#7251b6" stroke-width="2" stroke-dasharray="5 5"/>
<path d="M790 202l-13 23 16 17-22 22 11 21-19 15 13 26-17 24m34-108 27 13 13 24m-51 6-27-7-20 10" fill="none" stroke="#475569" stroke-width="3"/>
<path d="M850 210V344m-9-134h18m-18 134h18" fill="none" stroke="#7251b6" stroke-width="2"/>
<g font-family="Arial,sans-serif" font-size="18" fill="#64748b"><text x="161" y="391">Bridge / span / girder / face</text><text x="655" y="384">Scale + view direction + context</text></g>
<g font-family="Arial,sans-serif" fill="#334155"><text x="68" y="475" font-size="23" font-weight="700">Observation log · Example ID: S2–G2</text><text x="68" y="512" font-size="20">Date · location · observed feature · dimensions and method</text><text x="68" y="542" font-size="20">Photo references · access limits · comparison with earlier records</text></g>
<text x="45" y="598" font-family="Arial,sans-serif" font-size="18" fill="#64748b">A mapped observation is evidence; its cause and structural significance require interpretation.</text>
</svg>
